name: test
on:
  push:
    tags:
      - v*
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: test
        run: make test

      # A limiter, a cost accumulator and three sync.Once metric registrations
      # are all shared state: gonna-be-fine is not a test result, and the race
      # detector is the only thing that reads this code the way production does.
      - name: test -race
        run: make test-race
